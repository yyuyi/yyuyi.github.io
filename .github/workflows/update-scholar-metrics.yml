name: Update Google Scholar metrics

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-google-scholar-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the public Google Scholar profile
        env:
          GOOGLE_SCHOLAR_ID: W3SVZDYAAAAJ
        run: python scripts/update_scholar_metrics.py

      - name: Commit changed metrics
        run: |
          if git diff --quiet -- _data/scholar_metrics.json; then
            echo "Google Scholar metrics have not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar_metrics.json
          git commit -m "Update Google Scholar metrics"
          git push
