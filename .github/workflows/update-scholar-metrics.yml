name: Update Google Scholar metrics

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/update-scholar-metrics.yml"
      - "scripts/update_scholar_metrics.py"
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-google-scholar-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check API configuration
        id: api
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [[ -n "$SERPAPI_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SERPAPI_KEY is not configured; keeping the previous metrics."
          fi

      - name: Read the public Google Scholar profile
        if: steps.api.outputs.configured == 'true'
        env:
          GOOGLE_SCHOLAR_ID: W3SVZDYAAAAJ
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_scholar_metrics.py

      - name: Commit changed metrics
        if: steps.api.outputs.configured == 'true'
        run: |
          if git diff --quiet -- _data/scholar_metrics.json; then
            echo "Google Scholar metrics have not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar_metrics.json
          git commit -m "Update Google Scholar metrics"
          git push
